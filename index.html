<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/flowers.png" type="image/x-icon">
    <title>Blooming Garden — Interactive Flowers</title>
    <style>
        
       .button {
  background: #060708;
  background-image: -webkit-linear-gradient(top, #060708, #2c668a);
  background-image: -moz-linear-gradient(top, #060708, #2c668a);
  background-image: -ms-linear-gradient(top, #060708, #2c668a);
  background-image: -o-linear-gradient(top, #060708, #2c668a);
  background-image: linear-gradient(to bottom, #060708, #2c668a);
  -webkit-border-radius: 28;
  -moz-border-radius: 28;
  border-radius: 28px;
  text-shadow: 7px 5px 10px #420e42;
  font-family: Georgia;
  color: #edabed;
  font-size: 19px;
  padding: 10px 20px 10px 20px;
  text-decoration: none;
}

.button:hover {
  background: #c9e4f5;
  background-image: -webkit-linear-gradient(top, #c9e4f5, #2f373d);
  background-image: -moz-linear-gradient(top, #c9e4f5, #2f373d);
  background-image: -ms-linear-gradient(top, #c9e4f5, #2f373d);
  background-image: -o-linear-gradient(top, #c9e4f5, #2f373d);
  background-image: linear-gradient(to bottom, #c9e4f5, #2f373d);
  text-decoration: none;
}
    </style>
<meta name="description" content="Interactive CSS flower garden with gentle motion and accessible controls."><style>body{background:radial-gradient(circle at 50% 10%,#203d57,#070b16 70%);margin:0;min-height:100vh;height:auto;padding:24px;box-sizing:border-box}.greetings{letter-spacing:.12em}.description{text-align:center;color:#b8dae6}.button{box-shadow:0 12px 35px #0008;transition:transform .35s}.button:hover{transform:translateY(-5px)}.button a{color:#fff!important;font-size:15px!important}.greetings span{display:inline-block}@media(prefers-reduced-motion:reduce){.greetings span{animation:none!important;color:#fff!important;text-shadow:none!important}.button{transition:none}}</style></head>
<body>
    <div class="greetings">
        <span>H</span>
        <span>A</span>
        <span>L</span>
        <span>L</span>
        <span>O</span>
    </div>
    <div class="description">
        <span>Selamat datang di taman kecil ini ✨ </span>
    </div>
    <div class="button">
        <a href="flower.html">Masuk ke taman bunga →</a>
    </div>
</body>
</html>
